[build-system]
requires = ["setuptools>=68"]
build-backend = "setuptools.backends.legacy:build"

[project]
name = "invoice_extractor"
version = "0.1.0"
requires-python = ">=3.11"
dependencies = [
    "transformers",
    "datasets",
    "torch",
    "pillow",
    "tqdm",
    "seqeval",
    "accelerate",
    "pytesseract",
    "pdf2image",
]

[tool.setuptools.packages.find]
where = ["."]

[tool.pytest.ini_options]
testpaths = ["tests"]
